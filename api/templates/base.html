<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{{ blog_title }}{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    /* VS Code Dark+ palette */
    :root {
      --bg: #1e1e1e;
      --bg-panel: #252526;
      --border: #3c3c3c;
      --text: #d4d4d4;
      --muted: #858585;
      --blue: #569cd6;
      --yellow: #dcdcaa;
      --teal: #4ec9b0;
      --accent: #007acc;
    }
    body {
      font-family: "JetBrains Mono", Menlo, Consolas, "Courier New", monospace;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    header {
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border);
      border-top: 2px solid var(--accent);
      padding: 16px 20px;
    }
    header .blog-title {
      max-width: 680px;
      margin: 0 auto;
      font-size: 1.25rem;
      font-weight: 700;
    }
    header a { color: var(--teal); text-decoration: none; }
    header a:hover { color: var(--blue); }
    main {
      max-width: 680px;
      margin: 48px auto;
      padding: 0 20px;
    }
    h1 { font-size: 1.25rem; color: var(--yellow); margin: 0 0 0.5rem; }
    p { font-size: 0.9rem; color: var(--text); margin: 0 0 1rem; }
    h2 { font-size: 1rem; color: var(--blue); margin: 2rem 0 0.5rem; }
    .description {
      font-size: 0.85rem;
      font-style: italic;
      color: var(--muted);
      padding-bottom: 1.25rem;
      margin-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
    }
    ::selection { background: #264f78; }
    {% block styles %}{% endblock %}
  </style>
</head>
<body>
  <header>
    <div class="blog-title"><a href="/">{{ blog_title }}</a></div>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
